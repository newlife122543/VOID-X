<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID//X</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">

    <aside id="sidebar" class="sidebar">
        <div class="brand">
            <div class="brand-mark">V//X</div>
            <span class="brand-name">VOID//X</span>
        </div>

        <nav class="navigation">
            <button class="nav-item active" data-page="home">⌂ <span>Home</span></button>
            <button class="nav-item" data-page="chat">◉ <span>Chat</span></button>
            <button class="nav-item" data-page="localai">◈ <span>Local AI</span></button>

<button class="nav-item" data-page="games">◐ <span>Games</span></button>

    <main class="main">

            <div class="system-status">
                <span class="status-dot"></span>SYSTEM ONLINE

<script src="renderer.js"></script>
